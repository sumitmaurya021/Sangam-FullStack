services:
  - type: web
    name: sangam-fullstack
    runtime: ruby
    plan: free
    buildCommand: bundle install; bundle exec rake assets:precompile; bundle exec rails db:migrate
    startCommand: bundle exec rails server -p $PORT -b 0.0.0.0
    envVars:
      - key: RAILS_MASTER_KEY
        sync: false

      - key: DATABASE_URL
        fromDatabase:
          name: sangam-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          name: sangam-redis
          type: redis
          property: connectionString

      - key: RAILS_ENV
        value: production

      - key: RACK_ENV
        value: production

      - key: RAILS_LOG_TO_STDOUT
        value: enabled

      - key: RAILS_SERVE_STATIC_FILES
        value: true

      # Mailer
      - key: MAILER_HOST
        sync: false

      - key: SMTP_ADDRESS
        sync: false

      - key: SMTP_PORT
        value: "587"

      - key: SMTP_DOMAIN
        sync: false

      - key: SMTP_USERNAME
        sync: false

      - key: SMTP_PASSWORD
        sync: false

      # Cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false

      - key: CLOUDINARY_API_KEY
        sync: false

      - key: CLOUDINARY_API_SECRET
        sync: false

      # GIF API
      - key: GIPHY_API_KEY
        sync: false

      # WebRTC TURN Server
      - key: TURN_SERVER_URL
        value: "turn:openrelay.metered.ca:80"

      - key: TURN_SERVER_USERNAME
        value: "openrelayproject"

      - key: TURN_SERVER_CREDENTIAL
        value: "openrelayproject"

databases:
  - name: sangam-db
    plan: free
    databaseName: sangam_production
    user: sangam_user

  - name: sangam-redis
    type: redis
    plan: free
    ipAllowList: []
