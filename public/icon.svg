<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>

    <!-- Shine overlay -->
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="55%"  stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#4a2d8a" flood-opacity="0.35"/>
    </filter>

    <!-- Clip to rounded square -->
    <clipPath id="roundedSquare">
      <rect width="512" height="512" rx="120" ry="120"/>
    </clipPath>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="120" ry="120" fill="url(#bgGrad)"/>

  <!-- Shine layer -->
  <rect width="512" height="512" rx="120" ry="120" fill="url(#shine)"/>

  <!-- ── Two overlapping people silhouettes (Sangam = confluence) ── -->
  <g clip-path="url(#roundedSquare)" filter="url(#shadow)">

    <!-- Left person — head -->
    <circle cx="185" cy="168" r="52" fill="white" opacity="0.95"/>

    <!-- Left person — body arc -->
    <path d="M90 370 C90 300 140 268 185 268 C215 268 240 282 255 305"
          stroke="white" stroke-width="44" stroke-linecap="round" fill="none" opacity="0.95"/>

    <!-- Right person — head -->
    <circle cx="327" cy="168" r="52" fill="white" opacity="0.95"/>

    <!-- Right person — body arc -->
    <path d="M422 370 C422 300 372 268 327 268 C297 268 272 282 257 305"
          stroke="white" stroke-width="44" stroke-linecap="round" fill="none" opacity="0.95"/>

    <!-- Center connection dot — the "sangam" point where they meet -->
    <circle cx="256" cy="318" r="22" fill="white" opacity="1" filter="url(#glow)"/>

    <!-- Small decorative dots radiating from center -->
    <circle cx="256" cy="272" r="8" fill="white" opacity="0.55"/>
    <circle cx="256" cy="364" r="6" fill="white" opacity="0.35"/>
    <circle cx="222" cy="295" r="6" fill="white" opacity="0.40"/>
    <circle cx="290" cy="295" r="6" fill="white" opacity="0.40"/>

  </g>

  <!-- Bottom subtle arc decoration -->
  <path d="M80 460 Q256 510 432 460" stroke="white" stroke-width="3" fill="none" opacity="0.20" stroke-linecap="round"/>
</svg>
