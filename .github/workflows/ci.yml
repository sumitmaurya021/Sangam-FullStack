name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: sangam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: password
      DATABASE_URL: postgres://postgres:password@localhost:5432/sangam_test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.0
          bundler-cache: true

      - name: Set up Database Schema
        run: |
          bin/rails db:create db:schema:load

      - name: Run Brakeman Security Scan
        run: |
          bundle exec brakeman --no-pager

      - name: Run RSpec Test Suite & SimpleCov
        run: |
          bundle exec rspec

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: simplecov-coverage-report
          path: coverage/
